<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fábrica Stickman — demostración del motor</title>
  <meta name="description" content="Fábrica de videos de curiosidades con stickman animados.">
  <link rel="stylesheet" href="css/estilos.css?v=11">
</head>
<body>
  <header class="barra">
    <div class="barra-dentro">
      <span class="logo"><span class="logo-cabeza"></span>Fábrica <strong>Stickman</strong></span>
      <a class="etiqueta" href="index.html">← Volver a la fábrica</a>
    </div>
  </header>

  <main>
    <section class="tarjeta">
      <div class="fila-controles">
        <div class="grupo-botones" role="group" aria-label="Formato del video">
          <button type="button" class="btn activo" data-formato="16:9">▭ Horizontal 16:9</button>
          <button type="button" class="btn" data-formato="9:16">▯ Short 9:16</button>
        </div>
        <div class="grupo-botones" role="group" aria-label="Qué mostrar">
          <button type="button" class="btn activo" data-modo="ejemplo">🎬 Escena de ejemplo</button>
          <button type="button" class="btn" data-modo="probar">🧪 Probar acciones</button>
        </div>
      </div>

      <div class="escenario">
        <canvas id="lienzo" aria-label="Vista previa de la animación"></canvas>
      </div>

      <div class="fila-controles">
        <button type="button" class="btn btn-principal" id="botonPlay">⏸ Pausa</button>
        <button type="button" class="btn" id="botonInicio">⏮ Desde el inicio</button>
        <input type="range" id="linea" min="0" max="1000" value="0" aria-label="Línea de tiempo">
        <span id="tiempo" class="tiempo">0,0 s</span>
      </div>

      <div id="panelProbar" class="panel-probar" hidden>
        <label>Acción<select id="selAccion"></select></label>
        <label>Expresión<select id="selExpresion"><option value="">(la de la acción)</option></select></label>
        <label>Accesorio<select id="selAccesorio"><option value="">Ninguno</option></select></label>
        <label>Sostiene<select id="selSostiene"><option value="">(lo de la acción)</option></select></label>
        <label>Objeto<select id="selObjeto"><option value="">Ninguno</option></select></label>
        <label>Animación del objeto<select id="selAnimacion"></select></label>
        <label>Fondo<select id="selFondo"></select></label>
        <label>Efecto<select id="selEfecto"><option value="">Ninguno</option></select></label>
        <label>Cámara<select id="selCamara"></select></label>
        <label>Dice<input type="text" id="txtDice" placeholder="Texto del bocadillo (opcional)"></label>
      </div>
    </section>

    <p class="nota">Todo lo que ves lo dibuja la página: sin imágenes de IA y sin límite diario. En el paso 2, Gemini escribirá
      la curiosidad y decidirá qué hace cada muñequito en cada escena.</p>
  </main>

  <script src="js/stickman.js?v=11"></script>
  <script src="js/demo.js?v=11"></script>
</body>
</html>
