name = "fabrica-stickman"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Única página que puede usar el intermediario (GitHub Pages).
ORIGEN_PERMITIDO = "https://edwin2030-cmd.github.io"
# Modelo de Gemini. "gemini-flash-latest" siempre apunta al Flash más reciente.
MODELO = "gemini-flash-latest"
# Si el principal está saturado o sin cupo, se prueban estos en orden.
MODELOS_RESPALDO = "gemini-flash-lite-latest,gemini-2.5-flash,gemini-2.5-flash-lite"
# Modelos de texto a voz, en orden de preferencia.
MODELOS_VOZ = "gemini-2.5-flash-preview-tts"

# La clave NO va aquí. Se guarda como secreto con:
#   npx wrangler secret put GEMINI_API_KEY
